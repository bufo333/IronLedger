# The gate (docs/coding-contract.md rule 39): unit tests plus both smoke
# scripts, on every push and pull request.
name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: system libraries
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev python3
      - name: unit tests (builds zig-out/bin/game)
        run: zig build test --summary all
      - name: TUI smoke (pty)
        run: python3 docs/tui_smoke.py zig-out/bin/game /tmp/tui_smoke.db
      - name: REPL smoke
        run: bash docs/repl_smoke.sh zig-out/bin/game /tmp/repl_smoke.db
