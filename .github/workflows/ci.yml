# The gate (docs/coding-contract.md rule 72): formatting, the contract checks,
# unit tests and both smoke scripts on Linux and macOS, and a clean package
# build in ReleaseFast (rule 66). Pull requests run it; `main` runs it again
# after a merge. Actions are pinned to reviewed commits.
#
# A change that touches only prose (Markdown, the HTML pages, generated
# screenshots) skips CI. docs/tui.md (a test compares its key block) and
# docs/contract-exceptions.md (the size ratchet) are gate inputs and run it.
name: ci
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**.md'
      - '!docs/**.html'
      - '!docs/screenshots/**'
      - 'docs/tui.md'
      - 'docs/contract-exceptions.md'
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!docs/**.html'
      - '!docs/screenshots/**'
      - 'docs/tui.md'
      - 'docs/contract-exceptions.md'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The soundtrack is an optional asset no job reads.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/music/
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - name: system libraries
        run: dpkg -s libsqlite3-dev python3 >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y libsqlite3-dev python3)
      - name: formatting
        run: zig fmt --check build.zig src
      - name: contract checks (docs/verify-contract.sh)
        run: bash docs/verify-contract.sh
      # Baseline CPU: hosted Linux runners differ in CPU model, and a
      # native build's cache misses on every other model.
      - name: unit tests (builds zig-out/bin/game)
        run: zig build test --summary all -Dcpu=baseline
      - name: TUI smoke (pty)
        run: python3 docs/tui_smoke.py zig-out/bin/game /tmp/tui_smoke.db
      - name: REPL smoke
        run: bash docs/repl_smoke.sh zig-out/bin/game /tmp/repl_smoke.db

  gate-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The soundtrack is an optional asset no job reads.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/music/
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - name: unit tests (builds zig-out/bin/game)
        run: zig build test --summary all
      - name: TUI smoke (pty)
        run: python3 docs/tui_smoke.py zig-out/bin/game /tmp/tui_smoke.db
      - name: REPL smoke
        run: bash docs/repl_smoke.sh zig-out/bin/game /tmp/repl_smoke.db

  clean-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The soundtrack is an optional asset no job reads.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/music/
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - name: system libraries
        run: dpkg -s libsqlite3-dev python3 >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y libsqlite3-dev python3)
      - name: release build from the declared package paths only
        run: bash docs/clean-package.sh ReleaseFast

  data-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The soundtrack is an optional asset no job reads.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/music/
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - name: system libraries
        run: dpkg -s libsqlite3-dev python3 >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y libsqlite3-dev python3)
      # Every family of broken mod data fails the build (rule 58).
      - name: invalid-overlay fixtures
        run: python3 docs/data-fixtures.py -Dcpu=baseline
